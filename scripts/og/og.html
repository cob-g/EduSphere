<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Instrument+Serif:ital@1&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fff; color: #09090b;
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  }
  /* Faint grid, the footer's motif, fading toward the centre */
  .grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(9,9,11,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(9,9,11,.06) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 85% 50%, #000, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 85% 50%, #000, transparent 75%);
  }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; }
  .brand img { height: 44px; width: auto; }
  .brand .name { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .brand .ai { border: 1.5px solid rgba(9,9,11,.4); border-radius: 7px; padding: 1px 7px; font-size: 15px; font-weight: 500; line-height: 1.5; }
  h1 {
    position: absolute; left: 72px; bottom: 150px; margin: 0; max-width: 760px;
    font-size: 88px; line-height: 0.98; letter-spacing: -0.05em; font-weight: 600;
  }
  h1 .accent {
    display: block; color: #6e6e73;
    font-family: "Instrument Serif", "Times New Roman", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 1.08em; letter-spacing: -0.02em;
  }
  .foot { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: center; gap: 12px; font-size: 20px; color: #6e6e73; letter-spacing: -0.01em; }
  .foot .pill { display: inline-flex; align-items: center; gap: 9px; border: 1.5px solid #d9d9df; border-radius: 999px; padding: 8px 16px; font-size: 17px; font-weight: 500; color: #6e6e73; }
  .foot .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  /* Big mark on the right, cropped by the edge like the footer wordmark */
  .mark { position: absolute; right: -60px; top: 50%; transform: translateY(-50%); height: 520px; width: auto; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="mark" src="../../public/brand/edusphere-mark-black.png" alt="">
  <div class="brand">
    <img src="../../public/brand/edusphere-mark-black.png" alt="">
    <span class="name">EduSphere</span>
    <span class="ai">AI</span>
  </div>
  <h1>One platform.<span class="accent">Complete school intelligence.</span></h1>
  <div class="foot">
    <span class="pill"><i></i>AI-powered school platform</span>
    <span>Built in the Philippines for schools</span>
  </div>
</body>
</html>
